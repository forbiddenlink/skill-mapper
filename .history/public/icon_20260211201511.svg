<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="512" height="512" fill="#0a0a0a" rx="80"/>
  
  <!-- Skill tree structure - neon cyan theme -->
  <!-- Central node -->
  <circle cx="256" cy="256" r="40" fill="#00f3ff" opacity="0.2"/>
  <circle cx="256" cy="256" r="35" fill="#00f3ff" opacity="0.6"/>
  <circle cx="256" cy="256" r="25" fill="#00f3ff"/>
  
  <!-- Top nodes -->
  <line x1="256" y1="256" x2="180" y2="150" stroke="#00f3ff" stroke-width="4" opacity="0.6"/>
  <circle cx="180" cy="150" r="30" fill="#00f3ff" opacity="0.8"/>
  <circle cx="180" cy="150" r="20" fill="#0a0a0a"/>
  
  <line x1="256" y1="256" x2="332" y2="150" stroke="#00f3ff" stroke-width="4" opacity="0.6"/>
  <circle cx="332" cy="150" r="30" fill="#00f3ff" opacity="0.8"/>
  <circle cx="332" cy="150" r="20" fill="#0a0a0a"/>
  
  <!-- Bottom nodes -->
  <line x1="256" y1="256" x2="180" y2="362" stroke="#00f3ff" stroke-width="4" opacity="0.6"/>
  <circle cx="180" cy="362" r="30" fill="#00f3ff" opacity="0.8"/>
  <circle cx="180" cy="362" r="20" fill="#0a0a0a"/>
  
  <line x1="256" y1="256" x2="332" y2="362" stroke="#00f3ff" stroke-width="4" opacity="0.6"/>
  <circle cx="332" cy="362" r="30" fill="#00f3ff" opacity="0.8"/>
  <circle cx="332" cy="362" r="20" fill="#0a0a0a"/>
  
  <!-- Side nodes -->
  <line x1="256" y1="256" x2="120" y2="256" stroke="#00f3ff" stroke-width="4" opacity="0.6"/>
  <circle cx="120" cy="256" r="25" fill="#00f3ff" opacity="0.6"/>
  <circle cx="120" cy="256" r="15" fill="#0a0a0a"/>
  
  <line x1="256" y1="256" x2="392" y2="256" stroke="#00f3ff" stroke-width="4" opacity="0.6"/>
  <circle cx="392" cy="256" r="25" fill="#00f3ff" opacity="0.6"/>
  <circle cx="392" cy="256" r="15" fill="#0a0a0a"/>
  
  <!-- Glow effect -->
  <circle cx="256" cy="256" r="45" fill="none" stroke="#00f3ff" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="55" fill="none" stroke="#00f3ff" stroke-width="1" opacity="0.2"/>
</svg>
