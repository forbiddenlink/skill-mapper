<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f3ff" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Skill tree visualization (left side) -->
  <g transform="translate(200, 315)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="50" fill="#00f3ff" opacity="0.3"/>
    <circle cx="0" cy="0" r="40" fill="#00f3ff"/>
    
    <!-- Connected nodes -->
    <line x1="0" y1="0" x2="-80" y2="-100" stroke="#00f3ff" stroke-width="3" opacity="0.6"/>
    <circle cx="-80" cy="-100" r="30" fill="#00f3ff" opacity="0.8"/>
    
    <line x1="0" y1="0" x2="80" y2="-100" stroke="#00f3ff" stroke-width="3" opacity="0.6"/>
    <circle cx="80" cy="-100" r="30" fill="#00f3ff" opacity="0.8"/>
    
    <line x1="0" y1="0" x2="-80" y2="100" stroke="#00f3ff" stroke-width="3" opacity="0.6"/>
    <circle cx="-80" cy="100" r="30" fill="#00f3ff" opacity="0.8"/>
    
    <line x1="0" y1="0" x2="80" y2="100" stroke="#00f3ff" stroke-width="3" opacity="0.6"/>
    <circle cx="80" cy="100" r="30" fill="#00f3ff" opacity="0.8"/>
  </g>
  
  <!-- Title -->
  <text x="500" y="250" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#00f3ff">
    Skill Mapper
  </text>
  
  <!-- Subtitle -->
  <text x="500" y="330" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" opacity="0.8">
    Gamified Learning Platform
  </text>
  
  <!-- Features -->
  <text x="500" y="400" font-family="Arial, sans-serif" font-size="28" fill="#00f3ff" opacity="0.6">
    ⚡ Interactive Skill Trees  •  🎮 XP & Badges  •  📊 Progress Tracking
  </text>
  
  <!-- Accent line -->
  <rect x="500" y="430" width="400" height="3" fill="#00f3ff" opacity="0.6"/>
</svg>
