allowBuilds:
  '@sentry/cli': true
  core-js: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  # Security patches (Dependabot)
  postcss: '>=8.5.18 <9'
  'ws@7': '>=8.21.0 <9'
  'ws@8': '>=8.21.0 <9'
  uuid: '>=11.1.1'
  sharp: '>=0.35.0 <1'
  engine.io: '>=6.6.7 <7'
  '@opentelemetry/core': '>=2.8.0 <3'
  # Existing supply-chain hardening
  esbuild: '>=0.28.1'
  ajv: '>=8.18.0'
  '@eslint/eslintrc>ajv': '^6.14.0'
  'eslint>ajv': '^6.14.0'
  minimatch: '>=10.2.3'
  rollup: '>=4.59.0'
  storybook: '>=10.2.10'
  serialize-javascript: '>=7.0.5'
  next: '>=16.2.3'
  flatted: '>=3.4.2'
  picomatch: '>=4.0.4'
  brace-expansion: '>=5.0.7 <6'
  lodash: '>=4.18.0'
  cookie: '>=0.7.0 <2.0.0'
  systeminformation: '>=5.31.0'
  vite: '>=8.0.16'
  fast-uri: '>=4.1.1 <5'
  dompurify: '>=3.4.12 <4'
  protobufjs: '>=7.6.5 <8'
  undici: '>=7.28.0 <8'
